name: Ordered Pipeline
on:
  # push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup done
        run: |
          echo "Setup done"
          exit 1  # Deliberately fail this job
         

  verify:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Print runtime version
        run: node --version
      - name: Verify done
        run: echo "Verify done"

  finish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Print pipeline status
        run: echo "Pipeline finished"

    


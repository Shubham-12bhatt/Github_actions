name: Incident Switchboard

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Incident | {0}{1}',
          inputs.severity == 'high' && 'HIGH' ||
          inputs.severity == 'medium' && 'MEDIUM' || 'LOW',
          inputs.deep_scan && ' | SCAN' || '')  
      || format('Incident | AUTO | {0}', github.event_name) }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: Incident severity
        type: choice
        options:
          - low
          - medium
          - high
        default: low

      deep_scan:
        description: Run deep scan
        type: boolean
        default: false

      skip_tests:
        description: Skip tests
        type: boolean
        default: false

      reason:
        description: Reason for incident run
        type: string
        required: false


jobs:

  # --------------------------------
  # JOB 1 - TRIAGE
  # --------------------------------
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Print run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Print manual inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan }}"
          echo "Skip tests: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Automatic run message
        if: github.event_name != 'workflow_dispatch'
        run: echo "This run was automatic and no reason was supplied."

      - name: Low severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'low'
        run: echo "LOW severity - normal investigation."

      - name: Medium severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'medium'
        run: echo "MEDIUM severity - increased attention required."

      - name: High severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'high'
        run: echo "HIGH severity - immediate investigation required."


  # --------------------------------
  # JOB 2 - TESTS
  # --------------------------------
  tests:
    runs-on: ubuntu-latest
    needs: triage

    if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests

    defaults:
      run:
        working-directory: ./react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # --------------------------------
  # JOB 3 - SCAN
  # --------------------------------
  scan:
    runs-on: ubuntu-latest
    needs: triage

    if: inputs.deep_scan || inputs.severity == 'high'

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create scan report
        run: |
          TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq -n \
            --arg severity "${{ inputs.severity }}" \
            --argjson deep_scan "${{ inputs.deep_scan }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg time "$TIME" \
            '{
              severity: $severity,
              deep_scan: $deep_scan,
              actor: $actor,
              run_number: $run_number,
              time: $time
            }' > scan.json

          echo "Severity:"
          jq -r '.severity' scan.json

          echo "Actor:"
          jq -r '.actor' scan.json


  # --------------------------------
  # JOB 4 - REPORT
  # --------------------------------
  report:
    runs-on: ubuntu-latest

    needs:
      - tests
      - scan

    if: always()

    steps:
      - name: Print job results
        run: |
          echo "Tests result: ${{ needs.tests.result }}"
          echo "Scan result: ${{ needs.scan.result }}"

      - name: Print successful summary
        if: >-
          (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
          (needs.scan.result == 'success' || needs.scan.result == 'skipped')
        run: echo "Everything that ran completed successfully."

      - name: Print failure summary
        if: >-
          !((needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
          (needs.scan.result == 'success' || needs.scan.result == 'skipped'))
        run: echo "One or more executed jobs did not complete successfully."

      - name: Finish
        run: echo "Switchboard closed"